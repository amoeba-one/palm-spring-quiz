<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Night</title>
<style>
  :root{
    --bg:#12141c; --panel:#1d2130; --panel2:#262b3f; --text:#eef0f7; --muted:#9aa1b8;
    --accent:#f4b942; --green:#4cc38a; --red:#e5544b; --blue:#5b8def;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:18px}
  .wrap{max-width:960px;margin:0 auto;padding:16px 20px 80px}
  h1{font-size:1.5rem;margin:.4rem 0}
  h2{font-size:1.2rem;color:var(--accent);margin:.6rem 0}
  .card{background:var(--panel);border-radius:14px;padding:18px 20px;margin:14px 0}
  .muted{color:var(--muted)}
  button{font:inherit;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--panel2);color:var(--text)}
  button.primary{background:var(--accent);color:#1a1408;font-weight:700}
  button.big{font-size:1.15rem;padding:16px 28px}
  button.danger{background:var(--red);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  input[type=text],input[type=number]{font:inherit;background:var(--panel2);border:1px solid #3a4160;color:var(--text);border-radius:8px;padding:10px 12px}
  input[type=number]{width:90px;text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spread{justify-content:space-between}
  .qtext{font-size:1.7rem;line-height:1.4;margin:10px 0}
  .answer{background:#173226;border-left:5px solid var(--green);border-radius:8px;padding:12px 16px;font-size:1.25rem;white-space:pre-line}
  .timer{font-size:4.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .timer.warn{color:var(--accent)} .timer.crit{color:var(--red)}
  table{width:100%;border-collapse:collapse;margin:8px 0}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #333a55}
  th{color:var(--muted);font-weight:600;font-size:.85rem;text-transform:uppercase}
  .rank1 td{background:#2c2a14} .pos{font-weight:800;font-size:1.1rem}
  .pill{display:inline-block;background:var(--panel2);border-radius:999px;padding:3px 12px;font-size:.8rem;margin-left:8px}
  .pill.joker{background:var(--accent);color:#1a1408;font-weight:700}
  .teamchip{background:var(--panel2);border-radius:10px;padding:8px 14px;display:flex;gap:10px;align-items:center}
  .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .topbar .crumb{color:var(--muted);font-size:.9rem}
  .delta{color:var(--green);font-weight:700}
  audio{width:100%;margin-top:8px}
  label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
  .hidden{display:none}
  .progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:8px 0}
  .progress>div{height:100%;background:var(--blue);transition:width .3s}
  .chk{display:flex;gap:8px;align-items:center;cursor:pointer}
  .field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .field label{color:var(--muted);font-size:.85rem;text-transform:uppercase;font-weight:600}
  .field input[type=text],.field textarea,.field select{font:inherit;background:var(--panel2);border:1px solid #3a4160;color:var(--text);border-radius:8px;padding:10px 12px;width:100%}
  .q{display:grid;grid-template-columns:34px 1fr auto;gap:6px 10px;align-items:start;padding:12px 0;border-top:1px solid #333a55}
  .q .n{color:var(--muted);font-weight:700;padding-top:11px;text-align:right}
  .q textarea{font:inherit;background:var(--panel2);border:1px solid #3a4160;color:var(--text);border-radius:8px;padding:10px 12px;width:100%;overflow:hidden;resize:none;display:block}
  .q textarea.a{grid-column:2/4;background:#173226;border-color:#245a3f}
  .q .acts{display:flex;gap:4px}
  .q .opts{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .q .opt{display:flex;align-items:center;gap:8px}
  .q .opt b{color:var(--muted);width:18px;text-align:right}
  .q .opt input{flex:1;min-width:0}
  .q .optbtn{grid-column:2/4;display:flex;gap:8px}
  .linkbtn{background:none;color:var(--blue);padding:4px 6px;font-size:.9rem}
  .q .clip{align-items:center;flex-wrap:wrap}
  .q .trim{grid-column:2/4;background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .q .trim audio{width:100%;height:32px}
  .q .trim input[type=number]{width:80px;padding:6px 8px}
  .mini{padding:6px 10px;font-size:.85rem}
  .roundcard{border-left:4px solid var(--blue)}
  .err{color:var(--red);margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  .overlay .card{width:100%;max-width:420px}
  .quizrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #333a55}
  .quizrow:last-child{border-bottom:0}
  .quizrow .title{font-size:1.2rem;font-weight:700;flex:1;min-width:200px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ---------------- backend ---------------- */
const SUPABASE_URL="https://lkqyycjzfszehiqwdjon.supabase.co";
const SUPABASE_KEY="sb_publishable_8YO8hCczgwQ8yFBVDlKwng_FDocK709";
const CLIP_FN=SUPABASE_URL+"/functions/v1/clip";
const CLIP_MAX_MB=25;
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TIMERS = {question:15, marking:180, picture:300};
const LETTERS="ABCDEF";
const ROUND_TYPES={normal:"Normal (read out)", music:"Music (play clip)", picture:"Picture (on paper)"};

async function fetchQuizList(){
  const {data,error}=await db.from("quizzes").select("id,title,jokers,rounds,updated_at").order("updated_at",{ascending:false});
  if(error) throw error; return data;
}
async function fetchQuiz(id){
  const {data,error}=await db.from("quizzes").select("*").eq("id",id).maybeSingle();
  if(error) throw error; return data;
}
async function saveQuiz(quiz){
  return withPassword(pw=>db.rpc("save_quiz",{pw,quiz}));
}
async function deleteQuiz(id){
  return withPassword(pw=>db.rpc("delete_quiz",{pw,qid:id}));
}
// Edge function calls return the same {data,error} shape as supabase-js so withPassword can retry on a bad password.
async function clipRequest(method,body,headers={}){
  const res=await fetch(CLIP_FN,{method,body,headers:{apikey:SUPABASE_KEY,...headers}});
  const out=await res.json().catch(()=>({}));
  if(res.status===401) return {data:null,error:{code:"28000",message:out.error}};
  if(!res.ok) return {data:null,error:{message:out.error||res.statusText}};
  return {data:out,error:null};
}
function uploadClip(path,file){
  return withPassword(pw=>{ const f=new FormData(); f.append("pw",pw); f.append("path",path); f.append("file",file,file.name); return clipRequest("POST",f); });
}
function deleteClips(body){
  return withPassword(pw=>clipRequest("DELETE",JSON.stringify({pw,...body}),{"Content-Type":"application/json"}));
}
// Runs fn with the stored password; on rejection clears it and prompts. Resolves to {data}, or null if the prompt was cancelled.
async function withPassword(fn){
  for(;;){
    let pw=localStorage.getItem(PW_KEY);
    if(!pw){ pw=await promptPassword(); if(pw==null) return null; }
    const {data,error}=await fn(pw);
    if(!error){ localStorage.setItem(PW_KEY,pw); return {data}; }
    if(error.code==="28000"){ localStorage.removeItem(PW_KEY); pwError="Wrong password — try again."; continue; }
    throw error;
  }
}
let pwError="";
function promptPassword(){
  return new Promise(res=>{
    const m=document.getElementById("modal");
    m.innerHTML=`<div class="overlay"><div class="card">
      <h2>Password needed</h2><p class="muted">Editing quizzes needs the family password. It's remembered on this device.</p>
      <input type="text" id="pwin" autocomplete="off" style="width:100%" placeholder="Password" onkeydown="if(event.key==='Enter')document.getElementById('pwok').click()">
      ${pwError?`<div class="err">${esc(pwError)}</div>`:""}
      <div class="row" style="margin-top:14px"><button id="pwok" class="primary">OK</button><button id="pwcancel">Cancel</button></div></div></div>`;
    const done=v=>{ m.innerHTML=""; pwError=""; res(v); };
    document.getElementById("pwok").onclick=()=>done(document.getElementById("pwin").value);
    document.getElementById("pwcancel").onclick=()=>done(null);
    document.getElementById("pwin").focus();
  });
}

/* ---------------- state ---------------- */
const PW_KEY="psq-pw", NAV_KEY="psq-nav";
const gameKey=id=>"psq-game-"+id;
const blankGame=()=>({screen:"setup", teams:[], scores:{}, jokers:{}, round:0, q:0, phase:"roundIntro", done:[]});
let NAV = loadJSON(NAV_KEY) || {screen:"library", quizId:null};
let QUIZ=null;     // loaded quiz row being played
let S=null;        // game state for QUIZ
let LIB={quizzes:null, error:null};
let E=null;        // editor state {quiz, dirty, error, saving}
// scores[roundIdx] = {teamName: points}; jokers[teamName] = roundIdx used
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function save(){
  localStorage.setItem(NAV_KEY, JSON.stringify(NAV));
  if(S&&QUIZ) localStorage.setItem(gameKey(QUIZ.id), JSON.stringify(S));
}
const ROUNDS=()=>QUIZ.rounds;
const hasJokers=()=>QUIZ.jokers!==false;

let musicFiles = {}; // qIdx -> object URL (manual override, this session only)
const clipUrl=path=>`${SUPABASE_URL}/storage/v1/object/public/clips/${path}`;
function clipSrc(i){ const path=ROUNDS()[S.round].questions[i][3]; return musicFiles[i] || (path?clipUrl(path):null); }

/* ---------------- timer ---------------- */
let tHandle=null, tEnd=0, tTotal=0, tLabel="", tFired=false;
let wakeLock=null;
async function keepAwake(){ try{ if(!wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") keepAwake(); });
document.addEventListener("click",keepAwake,{once:true});
function startTimer(sec,label){ stopTimer(); tEnd=Date.now()+sec*1000; tTotal=sec; tLabel=label; tFired=false; keepAwake(); tick(); tHandle=setInterval(tick,250); }
function stopTimer(){ if(tHandle){clearInterval(tHandle); tHandle=null;} }
function tick(){
  const el=document.getElementById("timerbox");
  if(!el){ stopTimer(); return; }
  const tRemain=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  const m=Math.floor(tRemain/60), s=tRemain%60;
  const cls = tRemain<=5?"crit": tRemain<=15?"warn":"";
  el.innerHTML=`<div class="muted" style="text-align:center">${tLabel}</div>
    <div class="timer ${cls}">${m}:${String(s).padStart(2,"0")}</div>
    <div class="progress"><div style="width:${(tRemain/tTotal)*100}%"></div></div>`;
  if(tRemain<=0 && !tFired){ tFired=true; stopTimer(); beep(); el.querySelector(".timer").textContent="TIME'S UP!"; }
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3,0.6].forEach(t=>{ const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value=880;
      g.gain.setValueAtTime(0.4,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.25);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3); });
  }catch(e){}
}

/* ---------------- scoring helpers ---------------- */
function roundScore(team, r){
  const raw = (S.scores[r]||{})[team];
  if(raw==null) return null;
  return S.jokers[team]===r ? raw*2 : raw;
}
function totalScore(team){
  let t=0; for(const r of Object.keys(S.scores)){ const v=roundScore(team,+r); if(v!=null) t+=v; } return t;
}
function leaderboard(){
  const rows=S.teams.map(t=>({team:t,total:totalScore(t)})).sort((a,b)=>b.total-a.total);
  let pos=0,prev=null;
  rows.forEach((r,i)=>{ if(r.total!==prev){pos=i+1;prev=r.total;} r.pos=pos; });
  return rows;
}
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
const pts=n=>`${n} pt${n===1?"":"s"}`;
function roundPill(r){ return `<span class="pill">${r.questions.length} q · ${pts(r.ptsPerQ)} each${r.type!=="normal"?" · "+r.type:""}${r.allOrNothing?" · something or nothing":""}</span>`; }

/* ---------------- rendering ---------------- */
const app=document.getElementById("app");
function render(){ stopTimer(); save();
  if(NAV.screen==="library") return renderLibrary();
  if(NAV.screen==="editor"){ if(!E){ NAV={screen:"library",quizId:null}; return renderLibrary(); } return renderEditor(); }
  if(!QUIZ) return openQuiz(NAV.quizId);
  ({setup:renderSetup, round:renderRound, scoreEntry:renderScoreEntry, board:renderBoard, rules:renderRules}[S.screen]||renderSetup)();
}

function topbar(html){
  return `<div class="topbar"><strong>🌴 ${esc(QUIZ.title)}</strong><span class="crumb">${html||""}</span>
    <span style="flex:1"></span>
    <button onclick="goLibrary()">Quizzes</button>
    <button onclick="goRules()">Rules</button>
    <button onclick="goBoard()">Leaderboard</button>
    <button class="danger" onclick="resetAll()" style="padding:8px 12px;font-size:.8rem">Reset scores</button></div>`;
}

/* ---------------- library ---------------- */
function goLibrary(){ NAV={screen:"library",quizId:null}; QUIZ=null; S=null; render(); }
async function renderLibrary(){
  app.innerHTML=`<div class="topbar"><strong>🌴 Quiz Night</strong><span style="flex:1"></span><button class="primary" onclick="newQuiz()">+ New quiz</button></div>
    <div class="card"><h2>Quizzes</h2><p class="muted">Loading…</p></div>`;
  try{ LIB.quizzes=await fetchQuizList(); LIB.error=null; }
  catch(e){ LIB.error=e.message||String(e); }
  if(NAV.screen!=="library") return;
  const inner = LIB.error
    ? `<div class="err">Couldn't load quizzes: ${esc(LIB.error)}</div><button onclick="render()" style="margin-top:10px">Retry</button>`
    : LIB.quizzes.length ? LIB.quizzes.map(q=>{
        const g=loadJSON(gameKey(q.id)); const inProgress=g&&(g.teams.length||g.done.length);
        return `<div class="quizrow"><span class="title">${esc(q.title)}</span>
          <span class="pill">${q.rounds.length} round${q.rounds.length===1?"":"s"}</span>${q.jokers===false?'<span class="pill">no jokers</span>':""}
          ${inProgress?'<span class="pill" style="background:#173226;color:var(--green)">game in progress</span>':""}
          <span class="row"><button class="primary" onclick="playQuiz('${q.id}')">${inProgress?"Resume":"Play"}</button>
          <button onclick="editQuiz('${q.id}')">Edit</button><button onclick="duplicateQuiz('${q.id}')">Duplicate</button>
          <button class="danger mini" onclick="removeQuiz('${q.id}',this)">Delete</button></span></div>`; }).join("")
      : '<p class="muted">No quizzes yet — make one with “New quiz”.</p>';
  app.innerHTML=`<div class="topbar"><strong>🌴 Quiz Night</strong><span style="flex:1"></span><button class="primary" onclick="newQuiz()">+ New quiz</button></div>
    <div class="card"><h2>Quizzes</h2>${inner}</div>
    <p class="muted">Anyone can play. Creating or editing needs the family password.</p>`;
}
function playQuiz(id){ NAV={screen:"play",quizId:id}; QUIZ=null; render(); }
async function openQuiz(id){
  app.innerHTML=`<div class="card"><p class="muted">Loading quiz…</p></div>`;
  try{
    const q=await fetchQuiz(id);
    if(!q) throw new Error("That quiz no longer exists.");
    QUIZ=q; S=loadJSON(gameKey(id))||blankGame();
    if(S.round>=QUIZ.rounds.length){ S.round=0; S.q=0; S.phase="roundIntro"; S.screen="setup"; }
    render();
  }catch(e){
    app.innerHTML=`<div class="card"><div class="err">${esc(e.message||e)}</div><div class="row" style="margin-top:10px"><button onclick="render()">Retry</button><button onclick="goLibrary()">Back to quizzes</button></div></div>`;
  }
}
function libQuiz(id){ return (LIB.quizzes||[]).find(q=>q.id===id); }
function newQuiz(){ E=editorState({id:crypto.randomUUID(),title:"",jokers:true,rounds:[blankRound(1)]}); NAV={screen:"editor",quizId:null}; render(); }
function editQuiz(id){ const q=libQuiz(id); if(!q) return; E=editorState(JSON.parse(JSON.stringify(q))); NAV={screen:"editor",quizId:id}; render(); }
async function duplicateQuiz(id){
  const q=libQuiz(id); if(!q) return;
  // clips are shared with the original by path; removing the copy leaves them alone (see removeQuiz)
  try{ if(await saveQuiz({id:crypto.randomUUID(),title:q.title+" (copy)",jokers:q.jokers,rounds:q.rounds})) render(); }
  catch(e){ alertErr(e); }
}
let delArmedId=null;
async function removeQuiz(id,btn){
  if(delArmedId!==id){ delArmedId=id; btn.textContent="Delete?"; setTimeout(()=>{ if(delArmedId===id){ delArmedId=null; render(); } },3000); return; }
  delArmedId=null;
  try{ if(await deleteQuiz(id)){ localStorage.removeItem(gameKey(id)); await deleteClips({prefix:id}); render(); } }
  catch(e){ alertErr(e); }
}
function alertErr(e){ const m=document.getElementById("modal");
  m.innerHTML=`<div class="overlay"><div class="card"><h2>Something went wrong</h2><div class="err">${esc(e.message||e)}</div><button style="margin-top:12px" onclick="document.getElementById('modal').innerHTML=''">Close</button></div></div>`; }

/* ---------------- editor ---------------- */
const editorState=quiz=>({quiz,dirty:false,pending:{},pendingUrl:{},removed:[]}); // pending: "ri.qi" -> File to upload on save; removed: clip paths to delete on save
const blankRound=n=>({name:`Round ${n}`,type:"normal",ptsPerQ:1,allOrNothing:false,questions:[["",""]]});
function renderEditor(){
  const q=E.quiz;
  app.innerHTML=`<div class="topbar"><strong>🌴 ${q.id?"Edit quiz":"New quiz"}</strong><span style="flex:1"></span>
      <button onclick="editorBack(this)">← Quizzes</button><button class="primary" onclick="editorSave()" ${E.saving?"disabled":""}>${E.saving||"Save"}</button></div>
    ${E.error?`<div class="card err">${esc(E.error)}</div>`:""}
    <div class="card">
      <div class="field"><label>Quiz title</label><input type="text" data-p="title" value="${esc(q.title)}" placeholder="e.g. Palm Spring Quiz Night 2027"></div>
      <label class="chk"><input type="checkbox" data-p="jokers" ${q.jokers!==false?"checked":""}> Teams get a Joker (doubles one round's score)</label>
    </div>
    ${q.rounds.map((r,ri)=>`<div class="card roundcard">
      <div class="row spread"><h2 style="margin:0">Round ${ri+1}</h2><span class="row">
        <button class="mini" onclick="moveRound(${ri},-1)" ${ri===0?"disabled":""}>↑</button><button class="mini" onclick="moveRound(${ri},1)" ${ri===q.rounds.length-1?"disabled":""}>↓</button>
        <button class="mini danger" onclick="delRound(${ri})" ${q.rounds.length===1?"disabled":""}>Remove round</button></span></div>
      <div class="field"><label>Round name</label><input type="text" data-p="rounds.${ri}.name" value="${esc(r.name)}"></div>
      <div class="row">
        <div class="field" style="flex:1;min-width:180px"><label>Type</label><select data-p="rounds.${ri}.type">${Object.entries(ROUND_TYPES).map(([k,v])=>`<option value="${k}" ${r.type===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label>Points per question</label><input type="number" min="1" max="20" data-p="rounds.${ri}.ptsPerQ" value="${r.ptsPerQ}"></div>
        <label class="chk" style="margin-top:22px"><input type="checkbox" data-p="rounds.${ri}.allOrNothing" ${r.allOrNothing?"checked":""}> Something or Nothing (one wrong = 0)</label>
      </div>
      <p class="muted" style="margin:4px 0 8px">${r.type==="music"?"Music: the question text is shown on screen (e.g. “Clip 3”). Upload a clip per question; trim it to the part you'll play.":r.type==="picture"?"Picture: no questions are read out — teams get a sheet and a 5-minute timer. Use the question field as the label (e.g. “Logo 4”).":"Normal: you read each question out; use “Multiple choice options” under a question to show A/B/C/D on screen."}</p>
      ${r.questions.map((qn,qi)=>questionEditorHTML(r,ri,qn,qi)).join("")}
      <button style="margin-top:8px" onclick="addQ(${ri})">+ Add question</button>
    </div>`).join("")}
    <div class="card row spread"><button onclick="addRound()">+ Add round</button><button class="primary big" onclick="editorSave()" ${E.saving?"disabled":""}>${E.saving||"Save quiz"}</button></div>`;
  app.querySelectorAll("textarea").forEach(autoGrow);
}
function questionEditorHTML(r,ri,[qq,aa,opts,clip,trim],qi){
  const P=`rounds.${ri}.questions.${qi}`, key=`${ri}.${qi}`;
  const pend=E.pending[key], src=pend?E.pendingUrl[key]:clip?clipUrl(clip):null;
  const [start,end]=trim||[0,null];
  const clipHTML = r.type!=="music" ? "" : `<div class="optbtn clip">
      ${pend ? `<span class="pill" style="background:#173226;color:var(--green)">${esc(pend.name)} — uploads on save</span>` : clip ? "" : `<span class="muted">No clip yet</span>`}
      <label class="linkbtn" style="cursor:pointer">${src?"Replace clip":"+ Upload clip"}<input type="file" accept="audio/*" hidden onchange="stageClip(${ri},${qi},this.files[0])"></label>
      ${src?`<button class="linkbtn" onclick="unstageClip(${ri},${qi})">remove</button>`:""}</div>
    ${src?`<div class="trim">
      <audio id="trim-${key}" controls preload="metadata" src="${src}"></audio>
      <div class="row" style="gap:6px">
        <button class="mini" onclick="setTrim(${ri},${qi},0,trimAudio('${key}').currentTime)">Start here</button>
        <input type="number" min="0" step="0.5" value="${start}" oninput="setTrim(${ri},${qi},0,this.value,true)"> →
        <input type="number" min="0" step="0.5" value="${end??""}" placeholder="end" oninput="setTrim(${ri},${qi},1,this.value,true)">
        <button class="mini" onclick="setTrim(${ri},${qi},1,trimAudio('${key}').currentTime)">End here</button>
        <button class="mini primary" onclick="previewTrim('${key}',${start},${end??"null"})">▶ Preview</button>

function stageClip(ri,qi,file){
  if(!file) return;
  if(file.size>CLIP_MAX_MB*1048576){ E.error=`${file.name} is over ${CLIP_MAX_MB} MB.`; render(); return; }
  const key=`${ri}.${qi}`; E.pending[key]=file; E.pendingUrl[key]=URL.createObjectURL(file);
  E.quiz.rounds[ri].questions[qi].length=Math.min(E.quiz.rounds[ri].questions[qi].length,4); // new file: reset trim
  E.dirty=true; render();
}
function unstageClip(ri,qi){ const key=`${ri}.${qi}`; delete E.pending[key]; delete E.pendingUrl[key]; const q=E.quiz.rounds[ri].questions[qi]; if(q[3]) E.removed.push(q[3]); q.length=q[2]?3:2; E.dirty=true; render(); }
const trimAudio=key=>document.getElementById("trim-"+key);
const fmtSec=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
// which: 0=start, 1=end. Typed values don't re-render (keeps focus); button-set values do.
function setTrim(ri,qi,which,val,typed){
  const q=E.quiz.rounds[ri].questions[qi]; if(q.length<3) q[2]=null;
  const t=q[4]||[0,null]; const v=val===""?null:Math.max(0,Math.round(+val*2)/2);
  t[which]= which===0 ? (v||0) : v;
  if(t[1]!=null && t[1]<=t[0]) t[1]=null;
  q[4]=t; E.dirty=true; if(!typed) render();
}
function previewTrim(key,start,end){
  const a=trimAudio(key); if(!a) return;
  a.currentTime=start; a.play();
  a.ontimeupdate=()=>{ if(end!=null && a.currentTime>=end){ a.pause(); a.ontimeupdate=null; } };
}
function addOpts(ri,qi){ E.quiz.rounds[ri].questions[qi][2]=["","","",""]; E.dirty=true; render(); }
function addOpt(ri,qi){ E.quiz.rounds[ri].questions[qi][2].push(""); E.dirty=true; render(); }
function clearOpts(ri,qi){ const q=E.quiz.rounds[ri].questions[qi]; if(q[3]) q[2]=null; else q.length=2; E.dirty=true; render(); }
function autoGrow(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
app.addEventListener("input",ev=>{
  const el=ev.target, p=el.dataset.p; if(!E||!p) return;
  const path=p.split("."); let o=E.quiz;
  for(let i=0;i<path.length-1;i++) o=o[path[i]];

});
function addRound(){ E.quiz.rounds.push(blankRound(E.quiz.rounds.length+1)); E.dirty=true; render(); }
function delRound(i){ E.quiz.rounds[i].questions.forEach(q=>{ if(q[3]) E.removed.push(q[3]); }); E.quiz.rounds.splice(i,1); remapPending(k=>{ const [ri,qi]=k.split(".").map(Number); return ri===i?null:ri>i?`${ri-1}.${qi}`:k; }); E.dirty=true; render(); }
function moveRound(i,d){ const r=E.quiz.rounds; [r[i],r[i+d]]=[r[i+d],r[i]]; remapPending(k=>{ const [ri,qi]=k.split(".").map(Number); return ri===i?`${i+d}.${qi}`:ri===i+d?`${i}.${qi}`:k; }); E.dirty=true; render(); }
function remapPending(f){ const out={},urls={}; for(const [k,v] of Object.entries(E.pending)){ const nk=f(k); if(nk){ out[nk]=v; urls[nk]=E.pendingUrl[k]; } } E.pending=out; E.pendingUrl=urls; }
function addQ(ri){ E.quiz.rounds[ri].questions.push(["",""]); E.dirty=true; render(); app.querySelectorAll(`[data-p^="rounds.${ri}.questions."]`)[ (E.quiz.rounds[ri].questions.length-1)*2 ]?.focus(); }
function delQ(ri,qi){ const q=E.quiz.rounds[ri].questions; if(q[qi][3]) E.removed.push(q[qi][3]); q.splice(qi,1); remapPending(k=>{ const [r,i]=k.split(".").map(Number); return r!==ri?k:i===qi?null:i>qi?`${r}.${i-1}`:k; }); E.dirty=true; render(); }
function moveQ(ri,qi,d){ const q=E.quiz.rounds[ri].questions; [q[qi],q[qi+d]]=[q[qi+d],q[qi]]; remapPending(k=>{ const [r,i]=k.split(".").map(Number); return r!==ri?k:i===qi?`${r}.${qi+d}`:i===qi+d?`${r}.${qi}`:k; }); E.dirty=true; render(); }
let backArmed=false;
function editorBack(btn){
  if(E.dirty && !backArmed){ backArmed=true; btn.textContent="Discard changes?"; btn.style.background="var(--red)"; setTimeout(()=>{backArmed=false; if(NAV.screen==="editor") render();},3000); return; }
  backArmed=false; E=null; goLibrary();
}
function validateQuiz(q){
  if(!q.title.trim()) return "Give the quiz a title.";
  for(const [i,r] of q.rounds.entries()){
    if(!r.name.trim()) return `Round ${i+1} needs a name.`;
    if(r.questions.some(([qq])=>!qq.trim())) return `Round ${i+1} has an empty question.`;
    if(r.questions.some(([,,o])=>o&&o.some(x=>!x.trim()))) return `Round ${i+1} has an empty multiple-choice option.`;
  }
  return null;
}
async function editorSave(){
  const q=E.quiz; E.error=validateQuiz(q);
  if(E.error){ render(); return; }
  q.title=q.title.trim(); q.rounds.forEach(r=>{ r.name=r.name.trim(); r.questions=r.questions.map(([a,b,o,c,t])=>{ const out=[a.trim(),b.trim()]; if(o||c) out[2]=o?o.map(x=>x.trim()):null; if(c){ out[3]=c; if(t&&(t[0]>0||t[1]!=null)) out[4]=t; } return out; }); });
  E.saving=true; render();
  try{
    const jobs=Object.entries(E.pending);
    for(const [i,[key,file]] of jobs.entries()){
      E.saving=`Uploading clip ${i+1}/${jobs.length}…`; render();
      const [ri,qi]=key.split(".").map(Number), qn=q.rounds[ri].questions[qi];
      const ext=(file.name.match(/\.([a-z0-9]{1,5})$/i)||[,"mp3"])[1].toLowerCase();
      const res=await uploadClip(`${q.id}/${crypto.randomUUID()}.${ext}`,file);
      if(!res){ E.saving=false; render(); return; }   // password prompt cancelled
      if(qn[3]) E.removed.push(qn[3]);
      if(qn.length<3) qn[2]=null;
      qn[3]=res.data.path; delete E.pending[key]; delete E.pendingUrl[key];
    }
    E.saving="Saving…"; render();
    const saved=await saveQuiz(q);
    if(!saved){ E.saving=false; render(); return; }
    for(const path of E.removed) await deleteClips({path});
    E=null; goLibrary();
  }catch(e){ E.saving=false; E.error="Save failed: "+(e.message||e); render(); }
}

    <p class="muted">${R.allOrNothing
      ? `Something or Nothing: teams answer as many or as few as they like — ${pts(R.ptsPerQ)} per correct answer, but any wrong answer means 0 for the round. Enter the final round score (0–${maxPts}).`
      : `Max ${maxPts} points.${J?" Tick Joker if the team ticked the Joker box on this round's sheet (doubles the score, once per quiz).":""}`}</p>
    <table><tr><th>Team</th><th>Score</th>${J?"<th>Joker</th>":""}</tr>
    ${S.teams.map((t,i)=>{
      const jUsedElsewhere = S.jokers[t]!=null && S.jokers[t]!==r;
      const jHere = S.jokers[t]===r;
      return `<tr><td>${esc(t)}${J&&jUsedElsewhere?` <span class="pill">joker on R${S.jokers[t]+1} — ticking here moves it</span>`:""}</td>
      <td><input type="number" id="sc${i}" min="0" max="${maxPts}" value="${prior[t]!=null?prior[t]:""}"></td>
      ${J?`<td><label class="chk"><input type="checkbox" id="jk${i}" ${jHere?"checked":""}> ×2</label></td>`:""}</tr>`;
    }).join("")}</table>
    <div class="row" style="margin-top:14px">
      <button class="primary big" onclick="saveScores()">Save & show leaderboard</button>
      <button onclick="S.screen='round';S.phase='marking';render()">Back</button>
    </div>
  </div>`;
}
function saveScores(){
  const R=ROUNDS()[S.round], r=S.round;
  const maxPts=R.questions.length*R.ptsPerQ;
  const entry={};
  for(let i=0;i<S.teams.length;i++){
    const t=S.teams[i], el=document.getElementById("sc"+i), jk=document.getElementById("jk"+i);
    entry[t] = el.value===""?0:Math.max(0,Math.min(maxPts,+el.value||0));
    if(jk){ if(jk.checked) S.jokers[t]=r; else if(S.jokers[t]===r) delete S.jokers[t]; }
  }
  S.scores[r]=entry;
  if(!S.done.includes(r)) S.done.push(r);
  // auto-joker: if all rounds are now scored, apply unused jokers to the final round scored
  if(hasJokers() && S.done.length===ROUNDS().length){
    for(const t of S.teams){ if(S.jokers[t]==null) S.jokers[t]=r; }
  }
  S.lastScored=r; S.screen="board"; render();
}

/* ---------------- leaderboard ---------------- */
function renderBoard(){
  const rows=leaderboard();
  const r=S.lastScored;
  const showDelta = r!=null && S.scores[r] && ROUNDS()[r];
  app.innerHTML = topbar("Leaderboard") + `
  <div class="card">
    <h1>Leaderboard${showDelta?` <span class="pill">after ${esc(ROUNDS()[r].name)}</span>`:""}</h1>
    <table><tr><th>#</th><th>Team</th>${showDelta?"<th>This round</th>":""}<th>Total</th></tr>
    ${rows.map(x=>{
      const delta = showDelta? roundScore(x.team,r) : null;
      const jr = S.jokers[x.team];
      const jokerNow = showDelta && jr===r;
      return `<tr class="${x.pos===1?"rank1":""}"><td class="pos">${x.pos}</td>
        <td>${esc(x.team)}${jokerNow?` <span class="pill joker">JOKER PLAYED</span>`:jr!=null?` <span class="pill">joker used R${jr+1}</span>`:""}</td>
        ${showDelta?`<td class="delta">${delta!=null?"+"+delta+(jokerNow?` <span class="pill joker">×2</span>`:""):"—"}</td>`:""}
        <td><strong>${x.total}</strong></td></tr>`;
    }).join("")}</table>
    ${rows.length?"":'<p class="muted">No teams yet.</p>'}
    <div class="row" style="margin-top:14px">
      <button class="primary big" onclick="goSetup()">Rounds & setup</button>
      ${S.done.length===ROUNDS().length?'<h2 style="margin-left:10px">Final standings!</h2>':""}
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
